<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Chess (Offline)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b1220;
        color: #f8fafc;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 520px;
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: rgba(248, 250, 252, 0.86);
      }
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline</h1>
      <p>
        Kids Chess can work on an airplane, but it needs to be opened once while online so your tablet can
        save the game for offline use.
      </p>
      <p>
        When you have internet, open the app again and then use “Add to Home screen” for the best offline
        experience.
      </p>
    </div>
  </body>
</html>
